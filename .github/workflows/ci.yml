name: ci
on:
  push:
    branches:
      - master
      - main
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      - run: pip install mkdocs-material
      - run: pip install mkdocs-awesome-nav
      - run: pip install mkdocs-redirects
      - run: mkdocs build
      # Not `mkdocs gh-deploy --force`: that replaces the whole branch and
      # would wipe the PR previews kept under pr-preview/.
      - name: Check out gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 1
      - name: Publish to gh-pages
        working-directory: gh-pages
        run: |
          touch ../site/.nojekyll
          rsync -a --delete --exclude '/.git' --exclude '/pr-preview/' --exclude '/CNAME' ../site/ ./
          bash ../.github/scripts/push_gh_pages.sh \
            "Deployed ${GITHUB_SHA::7} with MkDocs version: $(mkdocs --version | awk '{print $3}')"
