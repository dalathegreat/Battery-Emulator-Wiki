name: Find orphaned images

on:
  workflow_dispatch:
    inputs:
      images_dir:
        description: 'Directory to scan'
        default: 'docs/images'
        required: true
      open_cleanup_pr:
        description: 'Open a PR deleting the orphans'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scan for orphaned images
        id: scan
        env:
          IMAGES_DIR: ${{ inputs.images_dir }}
          DOCS_DIR: 'docs'
          ORPHAN_LIST: ${{ runner.temp }}/orphans.txt
        run: python .github/scripts/find_orphaned_images.py

      - name: Open cleanup pull request
        if: inputs.open_cleanup_pr && steps.scan.outputs.orphan_count != '0'
        env:
          # A PAT sidesteps the "Actions cannot create pull requests"
          # restriction; GITHUB_TOKEN needs that setting enabled instead.
          GH_TOKEN: ${{ secrets.PR_IMAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="chore/remove-orphaned-images-${{ github.run_id }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH"
          xargs -r -d '\n' git rm --quiet -- < "${{ runner.temp }}/orphans.txt"
          git commit -m "chore: remove ${{ steps.scan.outputs.orphan_count }} orphaned image(s)"
          git push origin "$BRANCH"
          {
            echo "Removes images under \`${{ inputs.images_dir }}\` that no file references."
            echo
            echo "Generated by the *Find orphaned images* workflow — review the list before merging."
            echo
            echo '```'
            git show --stat --oneline HEAD | tail -n +2
            echo '```'
          } > body.md
          # The branch is already pushed, so a blocked PR creation is not
          # fatal — surface the link and let it be opened by hand.
          if ! gh pr create \
                --title "chore: remove orphaned images" \
                --body-file body.md \
                --head "$BRANCH" \
                --base "${{ github.ref_name }}"; then
            LINK="${{ github.server_url }}/${{ github.repository }}/compare/${{ github.ref_name }}...${BRANCH}?expand=1"
            echo "::warning::Could not open the pull request automatically."
            {
              echo
              echo "### Cleanup branch pushed"
              echo
              echo "The deletions are on \`${BRANCH}\`, but the pull request could not"
              echo "be created automatically. Open it here: ${LINK}"
              echo
              echo "To let this step finish on its own next time, enable"
              echo "**Settings → Actions → General → Workflow permissions →**"
              echo "**Allow GitHub Actions to create and approve pull requests**,"
              echo "or add a \`PR_IMAGES_TOKEN\` secret."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
